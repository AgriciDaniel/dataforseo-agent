name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck util
        run: bun run typecheck
        working-directory: engine/packages/util
      - name: Typecheck core
        run: bun run typecheck
        working-directory: engine/packages/core
      - name: Typecheck tui
        run: bun run typecheck
        working-directory: engine/packages/tui
      - name: Test util (charts, prices, cost guard helpers)
        run: bun test
        working-directory: engine/packages/util
      - name: Test tui
        run: bun test --timeout 30000
        working-directory: engine/packages/tui

  brain:
    name: Brain scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
        working-directory: Brain
